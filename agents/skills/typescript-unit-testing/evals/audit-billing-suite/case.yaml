schema_version: "1.1"
name: audit-billing-suite
expected_outcome: |
  An audit of src/billing.test.ts that gives each test a verdict backed by
  evidence. It catches the tests that can't fail (the un-awaited .catch
  webhook test, the try/catch parser test, the assertion-free "failed
  payments" test), the tautological discount oracle built from production
  constants, the redundant over-threshold discount tests, the declaration
  test on the threshold constant, and the weak splitBill check. It names the
  important gaps (the $100.00 discount boundary, the webhook parser's
  rejection paths, splitBill's sum and fairness), ideally proven with
  mutation probes. Sound tests (subtotal, valid parse, marks paid, zero
  people) are kept. No source or test file is changed.
context:
  scaffold_script: place-files.sh
