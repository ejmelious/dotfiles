name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Ubuntu runners have no zsh; macOS ships it.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Validate JSON
        run: jq empty claude/settings.json
      - name: Sandboxed install test
        run: ./scripts/test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x install.sh post-start-install.sh lib/common.sh lib/jira-auth.sh bin/dotfiles-doctor bin/agent-notify scripts/test.sh claude/hooks/guard-bash.sh claude/statusline.sh agents/skills/pre-queue-check/scripts/pre-queue-check.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
